<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculated Coffee</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@dotlottie/player-component@latest/dist/dotlottie-player.mjs" type="module"></script>
</head>
<body>
    

<div class="app-container">
    <h1>CALCULATE<br>YOUR<br>COFFEE</h1>

    <!--coffee shop-->
        <div class="animation-container">
        <dotlottie-player 
            src="Coffee Shop Barista.json" 
            background="transparent" 
            speed="1" 
            style="width: 500px; height: 300px;" 
            loop 
            autoplay>
        </dotlottie-player>
        </div>
      
    
    <div class="coffee-machine">
        <div style = " font-family:Playfair display"class="brand-label">CALCULATED COFFEE</div>

        <input type="text" id="display" readonly placeholder="Select Roast...">

        <div class="buttons-grid">
            <button class="control" onclick="clearDisplay()">AC</button>
            <button class="control" onclick="deleteLast()">DEL</button>
            <button class="operator" onclick="appendToDisplay('%')">%</button>
            <button class="operator" onclick="appendToDisplay('/')">/</button>

            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('9')">9</button>
            <button class="operator" onclick="appendToDisplay('*')">×</button>

            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button class="operator" onclick="appendToDisplay('-')">-</button>

            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('3')">3</button>
            <button class="operator" onclick="appendToDisplay('+')">+</button>

            <button class="zero" onclick="appendToDisplay('0')">0</button>
            <button onclick="appendToDisplay('.')">.</button>
            <button class="equals" onclick="calculate()">=</button>
        </div>

        <div class="brew-station" id="brew-station">
            <div class="cup">
        
                <span id="cup-result"> </span>

                <div class="cup-handle"></div>
            </div>
        </div>
    </div>
</div> 

   

    <script src="script.js"></script>
</body>
</html>
